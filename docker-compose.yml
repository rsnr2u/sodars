version: '3.8'

services:
  # Laravel PHP-FPM Application Service
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sodars_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      - redis

  # Nginx Web Server Service
  web:
    image: nginx:alpine
    container_name: sodars_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  # Redis Database Service
  redis:
    image: redis:alpine
    container_name: sodars_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Laravel Background Queue & Task Manager Service (Supervisor)
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sodars_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: bash -c "mkdir -p /var/log/supervisor && supervisord -n -c /var/www/html/docker/supervisor.conf"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      - app
      - redis
